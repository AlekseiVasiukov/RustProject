<div class="new-game-container">
  <div class="game-zone">
    <app-pixel-picture
      class="bg-picture"
      src="../../assets/images/Grand_Auto-Battler_concep_small.png"
      alt="game concept"
      width="80rem"
      height="80rem"
      pixelSize="4px"
    />
    <div class="description">
      <p class="game-title">
        Grand Auto-Battler is the game where you select faction and warriors for your fantasy
        warband.
      </p>
      <p class="game-title">
        The game engine (behind the server) will generate the fight outcomes.
      </p>
      <p class="game-title">PRESS "START NEW GAME" BUTTON!</p>
    </div>
  </div>

  <button class="btn-advance-stage" (click)="onStartNewGame()">START NEW GAME</button>
  <!-- class="start-button" -->
</div>
