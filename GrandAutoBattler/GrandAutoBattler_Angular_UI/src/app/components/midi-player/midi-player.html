<div class="midi-player">
  <button class="next-btn" (click)="playNextRandom()" [disabled]="isLoading()">Next Track</button>
  <div class="volumet-control">
    <span>Volume</span>
    <input
      type="range"
      min="0"
      max="1"
      step="0.01"
      [value]="soundfontService.volume()"
      (input)="onVolumeChange($event)"
    />
    <span>{{ soundfontService.volume() * 100 | number: '1.0-0' }}%</span>
  </div>
  <p class="current-song">
    {{ currentSongName }}
  </p>
</div>
