<div class="result-container">
  <div class="game-zone">
    @if (session.gameResult()) {
      <h1 class="result-message">
        {{ resultMessage() }}
      </h1>
    } @else {
      <p>No game result available.</p>
    }
  </div>
  <button class="btn-advance-stage" (click)="onStartNewGame()">Start New Game</button>
</div>
