@if (result()) {
  <div class="game-result-container">
    <div class="card">
      <h1>Game Result</h1>
      <h2 class="winner">Winner: {{ result().winner }}</h2>

      <div class="battle-journal">
        <h3>Battle Journal</h3>
        <ul>
          @for (entry of result().battleJournal; track $index) {
            <li>{{ entry }}</li>
          }
        </ul>
      </div>
    </div>
  </div>
} @else {
  <div class="loading-container flex-center">
    <p>Loading battle result...</p>
  </div>
}
