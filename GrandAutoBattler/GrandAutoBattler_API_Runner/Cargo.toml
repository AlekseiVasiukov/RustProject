[package]
name = "GrandAutoBattler_Api_Runner"
version = "0.1.0"
edition = "2024"

[dependencies]
GrandAutoBattler_GameEngine = { path = "../GrandAutoBattler_GameEngine" }
axum = { version = "0.8.9", features = [
    "json",
    "tokio",
    "tower-log",
    "tracing",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


[build-dependencies]
fs_extra = "1.3"
