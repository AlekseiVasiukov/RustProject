[package]
name = "local_llama_cpp_test"
version = "0.1.0"
edition = "2021"

# ℹ️  The list above tells Rust which edition (version rules) to use.
#     Edition 2021 is the current stable edition with async/await support.

[dependencies]
# ℹ️  Each line below adds an external library (called a "crate") to our project.
#     The "version" number is pinned to ensure consistent builds.

# Tokio - The async runtime that lets us use .await and run async code
tokio = { version = "1", features = ["full"] }

# Axum - The web framework for building our HTTP server
axum = { version = "0.7", features = ["macros"] }

# Reqwest - The HTTP client for making requests to llama.cpp server
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Serde - For serializing/deserializing JSON request and response data
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tower HTTP - Middleware for logging requests and CORS support
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Tracing - For structured logging (info, debug, error messages)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Anyhow - For easy error handling with the ? operator
anyhow = "1"

# Utoipa - For generating OpenAPI/Swagger documentation automatically
utoipa = { version = "4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "6", features = ["axum"] }

# Chrono - For working with timestamps in responses
chrono = { version = "0.4", features = ["serde"] }
